name: Deploy Couponia API Server 

on:
  pull_request:
    types: [closed]
    branches: ["production"]
    paths:
      - "apps/server/**"
  push:
    tags:
      - "couponia-api@*.*.*"
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  initialize-tag:
    runs-on: ubuntu-24.04
    name: Initialize Tag
    if: github.event.pull_request.merged == true
    outputs:
      version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Tag Initialization
        id: version
        uses: mitch1009/release-trigger@v1.2.6
        with:
          version_file_path: package.json
          release_branch: main
          working_directory: apps/server
          bump_script: pnpm release
          git_user_email: ${{ secrets.GIT_USER_EMAIL }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_username: ${{ secrets.GIT_USER_NAME }}
          git_token: ${{ secrets.GIT_TOKEN }}
  build:
    runs-on: ubuntu-24.04
    name: Build Admin App
    needs: initialize-tag
    if: needs.initialize-tag.outputs.version != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.6.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('apps/server/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        working-directory: apps/server
        run: |
          pnpm install --no-frozen-lockfile --no-recursive
      - name: geneate short commit hash
        id: short-commit-hash
        shell: bash
        run: |
          echo "SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}
      
      - name: build docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/server
          tags: |
            ghcr.io/${{ github.repository }}/couponia-api:latest
            ghcr.io/${{ github.repository }}/couponia-api:${{ needs.initialize-tag.outputs.version }}
            ghcr.io/${{ github.repository }}/couponia-api:${{ steps.short-commit-hash.outputs.SHORT_COMMIT_HASH }}
          push: true

  deploy:
    name: Deploy API Server

    environment:
      name: api-prod
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [build, initialize-tag]
    runs-on: ubuntu-24.04
    if: needs.initialize-tag.outputs.version != ''
    steps:
      - name: checkout
        uses: actions/checkout@v4.2.2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}
          
      - name: Login to Azure
        id: deployment
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_GLOBAL_CREDS }}
          
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3.0.2
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          slot-name:  api
          images: ghcr.io/${{ github.repository }}/couponia-api:${{ needs.initialize-tag.outputs.version }}

  create-release-prod-api:
    name: Create Release Prod API
    runs-on: ubuntu-24.04
    needs: [build, initialize-tag]
    if: needs.initialize-tag.outputs.version != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Create Release
        uses: softprops/action-gh-release@v2.0.4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          tag_name: couponia-api@${{ needs.initialize-tag.outputs.version }}
          generate_release_notes: true
  create-release-summary:
    name: Create Release Summary
    runs-on: ubuntu-24.04
    needs: [initialize-tag,create-release-prod-api]
    if: needs.initialize-tag.outputs.version != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Create Release Summary
        run: |
          echo "Release Version: couponia-api@${{ needs.initialize-tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Api URL : https://api.couponia.co.za" >> $GITHUB_STEP_SUMMARY
  monitor-failures:
    needs:  [initialize-tag, create-release-prod-api, create-release-summary, deploy]
    runs-on: ubuntu-24.04
    name: monitor deployment failures 

    if: failure()
    permissions:
      actions: read
      issues: write
      id-token: write
    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failedJobs = [];
            const workflow = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            for (const job of jobs.data.jobs) {
              if (job.conclusion === 'failure') {
                failedJobs.push({
                  name: job.name,
                  steps: job.steps.filter(step => step.conclusion === 'failure').map(step => step.name)
                });
              }
            }
            
            if (failedJobs.length > 0) {
              const issueBody = `
            ## Workflow Failure Alert
            
            Workflow: ${workflow.data.name}
            Run: [#${context.runNumber}](${workflow.data.html_url})
            Branch: ${workflow.data.head_branch}
            Commit: ${workflow.data.head_sha}
            
            ### Failed Jobs:
            ${failedJobs.map(job => `
            #### ${job.name}
            Failed steps:
            ${job.steps.map(step => `- ${step}`).join('\n')}
            `).join('\n')}
            
            Please investigate and fix these issues.
            `;
            
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Workflow Failure: ${workflow.data.name} #${context.runNumber}`,
                body: issueBody,
                labels: ['workflow-failure', 'bug']
              });
            }

