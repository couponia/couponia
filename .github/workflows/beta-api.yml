name: Deploy Beta API Server 

on:
  pull_request:
    types: [closed]
    branches: ["main"]
    paths:
      - "apps/server/**"
  push:
    tags:
      - "couponia@*.*.*-beta.*"


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  initialize-tag:
    runs-on: ubuntu-24.04
    name: Initialize Tag
    if: github.event.pull_request.merged == true
    outputs:
      version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Tag Initialization
        id: version
        uses: mitch1009/release-trigger@v1.2.6
        with:
          version_file_path: package.json
          release_branch: main
          working_directory: apps/server
          bump_script: pnpm beta
          git_user_email: ${{ secrets.GIT_USER_EMAIL }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_username: ${{ secrets.GIT_USER_NAME }}
          git_token: ${{ secrets.GIT_TOKEN }}
  build:
    runs-on: ubuntu-24.04
    name: Build Admin App
    needs: initialize-tag
    if: needs.initialize-tag.outputs.version != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9.6.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('apps/server/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        working-directory: apps/server
        run: |
          pnpm install --no-frozen-lockfile --no-recursive
      - name: geneate short commit hash
        id: short-commit-hash
        shell: bash
        run: |
          echo "SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build with API Server
        working-directory: apps/server
        run: |
          pnpm build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/server/dist
      - name: build docker image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/server
          tags: |
            ghcr.io/${{ github.repository }}/couponia-beta-api:latest
            ghcr.io/${{ github.repository }}/couponia-beta-api:${{ needs.initialize-tag.outputs.version }}
            ghcr.io/${{ github.repository }}/couponia-beta-api:${{ steps.short-commit-hash.outputs.SHORT_COMMIT_HASH }}
          push: true

  deploy:
    name: Deploy API Server

    environment:
      name: api-beta
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [build, initialize-tag]
    runs-on: ubuntu-24.04
    if: needs.initialize-tag.outputs.version != ''
    steps:
      - name: checkout
        uses: actions/checkout@v4.2.2
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}
          
      - name: Login to Azure
        id: deployment
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_GLOBAL_CREDS }}
          
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3.0.2
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          slot-name: beta-api
          images: ghcr.io/${{ github.repository }}/couponia-beta-api:latest